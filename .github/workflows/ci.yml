name: CI/CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ------------------------------------------------------------------
  # CLIENT FRONTEND JOBS
  # ------------------------------------------------------------------
  frontend-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        working-directory: ./client
        run: npm ci

      - name: Lint Client
        working-directory: ./client
        run: npm run lint

      - name: Test Client
        working-directory: ./client
        run: npm test

      - name: Build Client
        working-directory: ./client
        run: npm run build

  # ------------------------------------------------------------------
  # SERVER BACKEND JOBS
  # ------------------------------------------------------------------
  backend-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        working-directory: ./server
        run: npm ci

      - name: Test Server
        working-directory: ./server
        run: npm test

  # ------------------------------------------------------------------
  # SECURITY SCAN JOBS
  # ------------------------------------------------------------------
  security-audit:
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-check]
    steps:
      - uses: actions/checkout@v4

      - name: Scan Client Security
        working-directory: ./client
        continue-on-error: true # Warning only for now to prevent blocking
        run: npm audit --audit-level=high

      - name: Scan Server Security
        working-directory: ./server
        continue-on-error: true # Warning only for now to prevent blocking
        run: npm audit --audit-level=high

  # ------------------------------------------------------------------
  # DOCKER VERIFICATION JOB
  # ------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [security-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Compose Build
        run: docker-compose build
