services:
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/taxsaas
      - NODE_ENV=development
      - JWT_SECRET=dev_secret_jwt_key_123
      - RAZORPAY_KEY_ID=rzp_test_123
      - RAZORPAY_KEY_SECRET=rzp_test_secret
      - RAZORPAY_WEBHOOK_SECRET=your_webhook_secret
    depends_on:
      - mongo
    networks:
      - app-network

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=/api
    ports:
      - "3000:80" # Map host 3000 to container 80 (nginx)
    depends_on:
      - backend
    networks:
      - app-network

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - data_db:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  data_db:
