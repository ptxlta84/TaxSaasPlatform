# Render Deployment Configuration (Updated)
services:
  - type: web
    name: taxsaas-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: VITE_API_URL
        value: https://taxsaas-server.onrender.com
      - key: MONGODB_URI
        fromGroup: shared-secrets
      - key: JWT_SECRET
        fromGroup: shared-secrets
      - key: RAZORPAY_KEY_ID
        fromGroup: shared-secrets
      - key: RAZORPAY_KEY_SECRET
        fromGroup: shared-secrets
      - key: RAZORPAY_WEBHOOK_SECRET
        fromGroup: shared-secrets
      - key: CLOUDINARY_CLOUD_NAME
        fromGroup: shared-secrets
      - key: CLOUDINARY_API_KEY
        fromGroup: shared-secrets
      - key: CLOUDINARY_API_SECRET
        fromGroup: shared-secrets
    autoDeploy: true

  - type: web
    name: taxsaas-client
    env: docker
    dockerContext: client
    dockerfilePath: client/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://taxsaas-server.onrender.com/api
    autoDeploy: true

envGroups:
  - name: shared-secrets
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generate: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
