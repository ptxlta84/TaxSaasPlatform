services:
  - type: web
    name: taxsaas-server
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: VITE_API_URL
        value: https://taxsaas-server.onrender.com
      - fromGroup: shared-secrets
    autoDeploy: true

  - type: web
    name: taxsaas-client
    env: docker
    dockerContext: client
    dockerfilePath: client/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://taxsaas-server.onrender.com
    autoDeploy: true

envGroups:
  - name: shared-secrets
    envVars:
      - key: MONGODB_URI
      - key: JWT_SECRET
        generate: true
      - key: RAZORPAY_KEY_ID
      - key: RAZORPAY_KEY_SECRET
      - key: RAZORPAY_WEBHOOK_SECRET
