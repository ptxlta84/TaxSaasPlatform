services:
  # Backend Service
  - type: web
    name: taxsaas-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: VITE_API_URL
        value: https://taxsaas-server.onrender.com
      - fromGroup: shared-secrets
    autoDeploy: true

  # Frontend Service
  - type: web
    name: taxsaas-client
    env: docker
    dockerContext: client
    dockerfilePath: client/Dockerfile
    envVars:
      - key: VITE_API_URL
        value: https://taxsaas-server.onrender.com
    autoDeploy: true

# Shared Environment Group (Secrets)
envGroups:
  - name: shared-secrets
    envVars:
      - key: MONGODB_URI
        sync: false # User must enter manually in dashboard
      - key: JWT_SECRET
        generate: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
